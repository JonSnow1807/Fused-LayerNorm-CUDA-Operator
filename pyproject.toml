[build-system]
requires = ["setuptools>=61", "wheel", "torch>=2.4"]
build-backend = "setuptools.build_meta"

[project]
name = "fused_layernorm"
dynamic = ["version"]
description = "A small, readable fused LayerNorm(+GELU) forward CUDA kernel for PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chinmay Shrivastava" }]
keywords = ["pytorch", "cuda", "layernorm", "gelu"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "fused_layernorm.__version__" }

[project.urls]
Homepage = "https://github.com/JonSnow1807/Fused-LayerNorm-CUDA-Operator"
Repository = "https://github.com/JonSnow1807/Fused-LayerNorm-CUDA-Operator"
Issues = "https://github.com/JonSnow1807/Fused-LayerNorm-CUDA-Operator/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a CUDA GPU"]
